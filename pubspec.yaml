name: privacy_mask
description: A lightweight Flutter widget to protect sensitive content by preventing screenshots and screen recording at the OS level on Android and iOS.
version: 1.0.2
repository: https://github.com/VladRoscaDev/privacy_mask 
homepage: https://github.com/VladRoscaDev/privacy_mask

environment:
  sdk: '>=3.10.4 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  # Add these for web support
  web: ^1.0.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.VladRoscaDev.privacy_mask
        pluginClass: PrivacyMaskPlugin
      ios:
        pluginClass: PrivacyMaskPlugin
      web:
        pluginClass: PrivacyMaskWeb
        fileName: privacy_mask_web.dart